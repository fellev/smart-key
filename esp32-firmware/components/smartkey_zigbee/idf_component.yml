## The Zigbee stack is only available on 802.15.4 capable targets, so the
## dependency is guarded by a rule. On other targets smartkey_zigbee still
## builds, using the stub implementation.
dependencies:
  espressif/esp-zigbee-lib:
    version: "~1.6.0"
    rules:
      - if: "target in [esp32c5, esp32c6, esp32h2]"
  espressif/esp-zboss-lib:
    version: "~1.6.0"
    rules:
      - if: "target in [esp32c5, esp32c6, esp32h2]"
